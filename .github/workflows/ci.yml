name: GALANT POST - CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: galant_test
          POSTGRES_USER: galant
          POSTGRES_PASSWORD: galant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galant -d galant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://galant:galant_test@127.0.0.1:5432/galant_test
    defaults: {run: {working-directory: apps/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: apps/frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/install-preview.sh scripts/diagnose.sh scripts/backup-preview.sh scripts/verify-restore-preview.sh scripts/update-preview.sh
      - run: python3 -m py_compile scripts/soak_24h.py
      - name: Validate isolated Docker preview config
        env:
          APP_SECRET: ci_test_secret
          POSTGRES_PASSWORD: ci_test_password
        run: |
          printf 'APP_SECRET=%s\nPOSTGRES_PASSWORD=%s\n' "$APP_SECRET" "$POSTGRES_PASSWORD" > .env.preview
          docker compose --env-file .env.preview -f docker-compose.preview.yml config --quiet
          python3 - <<'PY'
          import json,subprocess
          cmd=["docker","compose","--env-file",".env.preview","-f","docker-compose.preview.yml","config","--format","json"]
          c=json.loads(subprocess.check_output(cmd,text=True))
          assert c["name"] == "galant-post-preview"
          assert set(c["services"]) == {"db","api","worker","frontend","proxy"}
          for key,v in c["services"].items():
              ports=v.get("ports",[])
              if key=="proxy":
                  assert len(ports)==1
                  assert ports[0].get("host_ip")=="127.0.0.1"
                  assert str(ports[0].get("published"))=="18512"
              else:
                  assert not ports
          PY
          rm -f .env.preview
  restore-smoke:
    name: Backup + isolated restore (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create a temporary private PDF and minimal relational schema
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cat > .env.preview <<'CONFIG'
          APP_SECRET=ci-only-test-secret
          POSTGRES_PASSWORD=ci-only-test-db
          CONFIG
          mkdir -p preview-storage/fixture
          printf 'Synthetic document only: no user data\\n' > preview-storage/fixture/evidence.txt
          docker compose --env-file .env.preview -f docker-compose.preview.yml up -d db
          for i in {1..30}; do
            if docker compose --env-file .env.preview -f docker-compose.preview.yml exec -T db pg_isready -U galant -d galant; then break; fi
            sleep 2
          done
          digest="$(sha256sum preview-storage/fixture/evidence.txt | cut -d' ' -f1)"
          docker compose --env-file .env.preview -f docker-compose.preview.yml exec -T db psql -v ON_ERROR_STOP=1 -U galant -d galant <<SQL
          CREATE TABLE organizations (id text primary key, name text not null);
          CREATE TABLE users (id text primary key, org_id text not null references organizations(id));
          CREATE TABLE documents (id text primary key, org_id text not null references organizations(id), storage_path text not null, sha256 text not null);
          INSERT INTO organizations VALUES ('company-1','Test firm');
          INSERT INTO users VALUES ('user-1','company-1');
          INSERT INTO documents VALUES ('doc-1','company-1','/data/private/fixture/evidence.txt','$digest');
          SQL
      - name: Backup and restore the synthetic database and verify private file hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          export GALANT_BACKUP_DIR="$RUNNER_TEMP/galant-ci-backups"
          bash scripts/backup-preview.sh | tee "$RUNNER_TEMP/galant-backup.log"
          backup_path="$(sed -n 's/^BACKUP_PATH=//p' "$RUNNER_TEMP/galant-backup.log" | tail -1)"
          test -d "$backup_path"
          bash scripts/verify-restore-preview.sh "$backup_path"
          echo "Isolated backup and restoration verified in CI"
  deploy-vps:
    name: Deploy VPS
    needs: [backend, frontend, compose, restore-smoke]
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       vars.VPS_MANUAL_DEPLOY_ALLOWED == 'true') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       vars.VPS_AUTODEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: galant-post-vps-preview
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '89.117.144.140' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for key in VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!key}" ]]; then
              echo "::error title=Configuración VPS incompleta::Falta el secreto ${key}."
              missing=1
            fi
          done
          exit "$missing"
      - name: Configure verified SSH access
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/galant_vps_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/galant_known_hosts"
          chmod 600 "$RUNNER_TEMP/galant_vps_key"
      - name: Update the isolated VPS stack
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_port="${VPS_PORT:-22}"
          ssh -i "$RUNNER_TEMP/galant_vps_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/galant_known_hosts" \
            -p "$ssh_port" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          target_ref="$1"
          cd /opt/galant-post
          git fetch --no-tags --depth=1 origin "$target_ref"
          bootstrap_script="/tmp/galant-post-update-${target_ref}.sh"
          trap 'rm -f "$bootstrap_script"' EXIT
          git show "${target_ref}:scripts/update-preview.sh" > "$bootstrap_script"
          GALANT_DEPLOY_DIR=/opt/galant-post bash "$bootstrap_script" "$target_ref"
          REMOTE
