name: GALANT POST - CI
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  workflow_call:

# Evitar la doble ejecución push + pull_request en ramas de desarrollo.
# main se valida después del merge; las ramas de trabajo, vía pull_request.
# Se conserva cancel-in-progress para PR obsoletos de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  backend:
    # Imagen estable para dependencias OCR/LibreOffice: evita los mirrors
    # resolute de Ubuntu latest que fallaron DNS en el runner anterior.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: galant_test
          POSTGRES_USER: galant
          POSTGRES_PASSWORD: galant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galant -d galant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://galant:galant_test@127.0.0.1:5432/galant_test
    defaults: {run: {working-directory: apps/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify backend system dependencies; install only what is missing
        run: |
          set -Eeuo pipefail
          required=(tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng libreoffice-calc fonts-dejavu-core)
          missing=()
          for package in "${required[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Dependencias faltantes: ${missing[*]}"
            # No dejar ocupada la CI durante muchos minutos ante cortes DNS.
            # Un fallo de aprovisionamiento debe verse ROJO, nunca ignorarse.
            timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=12 update
            timeout 180s sudo apt-get -y -o Acquire::Retries=1 -o Acquire::http::Timeout=12 install "${missing[@]}"
          fi
          command -v tesseract >/dev/null
          command -v libreoffice >/dev/null
          tesseract --list-langs | grep -Eq '(^|[[:space:]])spa([[:space:]]|$)'
          echo "OCR español y LibreOffice disponibles para todas las pruebas."
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - name: QA de los diez PDF A4 nativos (sin datos reales)
        # No ejecutar una segunda prueba con dependencias no instaladas si
        # el aprovisionamiento del job falló; el job ya queda en rojo.
        if: success()
        run: python ../../scripts/qa_javiera_v19_print_visual.py --output "$RUNNER_TEMP/javiera-v19-print"
      - name: Evidencia visual de los diez formatos (PNG + PDF + informe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galant-javiera-v19-print
          path: ${{ runner.temp }}/javiera-v19-print
          if-no-files-found: warn
  backend_irl:
    name: Backend IRL independiente — fórmulas, roles y firmas
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults: {run: {working-directory: apps/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Pruebas sintéticas que no requieren OCR, LibreOffice ni datos reales.
      # Si falla un caso aquí, no ocultarlo bajo problemas de apt.
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_javiera_irl_private_source_fingerprints.py tests/test_javiera_v195_editable_blocks.py tests/test_javiera_irl_integrity.py
  backend_pdf:
    name: PDF A4 independiente — diez documentos sintéticos
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults: {run: {working-directory: apps/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      # El motor HTML -> PDF usa PyMuPDF, no LibreOffice. Cada PDF se
      # inspecciona por tamaño A4, tipografía, texto, bordes y firmas.
      - name: Verificar IRL completo — 13 riesgos, cinco imágenes y HTML aprobado
        run: python -m pytest -q tests/test_javiera_irl_pdf_a4_source.py
      - name: Verificar 10 PDF reales con geometría sintética
        run: python ../../scripts/qa_javiera_v19_print_visual.py --output "$RUNNER_TEMP/javiera-pdf-independiente"
      - name: Guardar evidencias PDF y capturas de cada página
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galant-pdf-a4-independiente
          path: ${{ runner.temp }}/javiera-pdf-independiente
          if-no-files-found: warn
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: apps/frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:logic
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/install-preview.sh scripts/diagnose.sh scripts/backup-preview.sh scripts/verify-restore-preview.sh scripts/update-preview.sh scripts/start-qa-preview.sh scripts/wait-for-final-postgres.sh
      - run: python3 -m py_compile scripts/soak_24h.py scripts/qa_stack_smoke.py scripts/qa_operational_smoke.py scripts/qa_network_browser.py scripts/qa_v1010_browser.py scripts/qa_ux_2026_browser.py scripts/qa_v1501_focus_browser.py scripts/qa_v1502_scroll_browser.py scripts/qa_v1504_creator_browser.py scripts/qa_javiera_v16_browser.py scripts/qa_javiera_v165_workflow_browser.py scripts/qa_javiera_ux_bot.py
      - name: Validate manual/automatic VPS deployment security contracts
        run: python3 scripts/qa_manual_deploy_contract.py
      - name: Validate automatic release gate with synthetic Git commits
        run: python3 scripts/test_auto_release.py
      - name: Compile auto-release scripts
        run: python3 -m py_compile scripts/check_auto_release.py scripts/test_auto_release.py
      - name: Reproduce temporary PostgreSQL startup race (deterministic)
        run: python3 scripts/test_wait_for_final_postgres.py
      - name: Validate isolated Docker preview config
        env:
          APP_SECRET: ci_test_secret
          POSTGRES_PASSWORD: ci_test_password
        run: |
          printf 'APP_SECRET=%s\nPOSTGRES_PASSWORD=%s\n' "$APP_SECRET" "$POSTGRES_PASSWORD" > .env.preview
          docker compose --env-file .env.preview -f docker-compose.preview.yml config --quiet
          python3 - <<'PY'
          import json,subprocess
          cmd=["docker","compose","--env-file",".env.preview","-f","docker-compose.preview.yml","config","--format","json"]
          c=json.loads(subprocess.check_output(cmd,text=True))
          assert c["name"] == "galant-post-preview"
          assert set(c["services"]) == {"db","api","worker","frontend","proxy"}
          for key,v in c["services"].items():
              ports=v.get("ports",[])
              if key=="proxy":
                  assert len(ports)==1
                  assert ports[0].get("host_ip")=="127.0.0.1"
                  assert str(ports[0].get("published"))=="18512"
              else:
                  assert not ports
          PY
          cat > .env.qa <<'ENV'
          APP_SECRET=qa_test_secret
          POSTGRES_PASSWORD=qa_test_password
          PORT=18612
          ENV
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml config --quiet
          python3 - <<'PY'
          import json, subprocess, pathlib
          cmd=["docker","compose","-p","galant-post-qa","--env-file",".env.qa",
               "-f","docker-compose.preview.yml","-f","docker-compose.qa.yml",
               "config","--format","json"]
          config=json.loads(subprocess.check_output(cmd,text=True))
          assert config["name"]=="galant-post-qa"
          for service in ("api","worker"):
              volumes=[v for v in config["services"][service]["volumes"] if v.get("target")=="/data/private"]
              assert len(volumes)==1, (service, volumes)
              assert pathlib.Path(volumes[0]["source"]).resolve() == pathlib.Path("qa-storage").resolve(), (service, volumes)
          ports=config["services"]["proxy"]["ports"]
          assert len(ports)==1 and ports[0].get("host_ip")=="127.0.0.1",ports
          assert str(ports[0].get("published"))=="18612",ports
          print("La QA no comparte almacenamiento ni puertos de preview")
          PY
          rm -f .env.preview .env.qa
  restore-smoke:
    name: Backup + isolated restore (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create a temporary private PDF and minimal relational schema
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cat > .env.preview <<'CONFIG'
          APP_SECRET=ci-only-test-secret
          POSTGRES_PASSWORD=ci-only-test-db
          CONFIG
          mkdir -p preview-storage/fixture
          printf 'Synthetic document only: no user data\\n' > preview-storage/fixture/evidence.txt
          docker compose --env-file .env.preview -f docker-compose.preview.yml up -d db
          for i in {1..30}; do
            if docker compose --env-file .env.preview -f docker-compose.preview.yml exec -T db pg_isready -U galant -d galant; then break; fi
            sleep 2
          done
          digest="$(sha256sum preview-storage/fixture/evidence.txt | cut -d' ' -f1)"
          docker compose --env-file .env.preview -f docker-compose.preview.yml exec -T db psql -v ON_ERROR_STOP=1 -U galant -d galant <<SQL
          CREATE TABLE organizations (id text primary key, name text not null);
          CREATE TABLE users (id text primary key, org_id text not null references organizations(id));
          CREATE TABLE documents (id text primary key, org_id text not null references organizations(id), storage_path text not null, sha256 text not null);
          INSERT INTO organizations VALUES ('company-1','Test firm');
          INSERT INTO users VALUES ('user-1','company-1');
          INSERT INTO documents VALUES ('doc-1','company-1','/data/private/fixture/evidence.txt','$digest');
          SQL
      - name: Backup and restore the synthetic database and verify private file hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          export GALANT_BACKUP_DIR="$RUNNER_TEMP/galant-ci-backups"
          bash scripts/backup-preview.sh | tee "$RUNNER_TEMP/galant-backup.log"
          backup_path="$(sed -n 's/^BACKUP_PATH=//p' "$RUNNER_TEMP/galant-backup.log" | tail -1)"
          test -d "$backup_path"
          bash scripts/verify-restore-preview.sh "$backup_path"
          # Repetir contra el mismo respaldo para detectar fallos intermitentes de initdb.
          bash scripts/verify-restore-preview.sh "$backup_path"
          echo "Isolated backup and repeated restoration verified in CI"
  qa-stack-smoke:
    name: QA isolated stack - two users and restart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_SMOKE_PASSWORD: "qa-synthetic-only-2026-unique-no-real-users"
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated QA
        run: |
          set -Eeuo pipefail
          cat > .env.qa <<ENV
          APP_SECRET=$(openssl rand -hex 48)
          POSTGRES_PASSWORD=qa-synthetic-db-only-2026
          PORT=18612
          SECURE_COOKIES=false
          ENV
          # El volumen privado pertenece al usuario galant del contenedor,
          # igual que preview-storage en install-preview.sh.
          sudo install -d -o 10001 -g 10001 -m 0700 qa-storage
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml config --quiet
      - name: Build and start isolated QA services (restricted source file permissions)
        run: |
          set -Eeuo pipefail
          # Reproduce the VPS checkout under umask 077 (0600 files/0700 dirs).
          # Previously this made /srv/app/main.py and cli.py unreadable by UID 10001.
          chmod -R go-rwx apps/backend/app
          COMPOSE_PARALLEL_LIMIT=1 docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml up -d --build db api worker frontend proxy
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml exec -T api python -m app.cli init-db
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml exec -T api sh -c 'test -r /srv/app/main.py && test -r /srv/app/cli.py'
      - name: Verify private document storage as application user
        run: |
          set -Eeuo pipefail
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml exec -T api python - <<'PY'
          import os, stat, tempfile
          from pathlib import Path
          from app.config import settings
          root = settings().document_dir
          assert root.stat().st_uid == os.geteuid() == 10001
          assert stat.S_IMODE(root.stat().st_mode) == 0o700
          with tempfile.TemporaryDirectory(dir=root, prefix=".qa-storage-") as folder:
              path = Path(folder) / "probe.pdf"
              with path.open("xb") as handle:
                  handle.write(b"Synthetic private storage probe")
              path.chmod(0o600)
              assert path.read_bytes() == b"Synthetic private storage probe"
              assert stat.S_IMODE(path.stat().st_mode) == 0o600
          print("Private document storage verified for UID 10001, directory 0700 and file 0600")
          PY
      - name: Seed two synthetic users in same org
        run: |
          set -Eeuo pipefail
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml exec -T -e QA_SMOKE_PASSWORD api python - <<'PY'
          import os
          from app.db import SessionLocal
          from app.models import Organization, User
          from app.security import hash_password
          from app.ops_api import ensure_sites
          with SessionLocal.begin() as db:
              org = Organization(name="Synthetic QA Company")
              other_org = Organization(name="Isolated Test Tenant")
              db.add_all([org, other_org])
              db.flush()
              org_id = org.id
              pw = hash_password(os.environ["QA_SMOKE_PASSWORD"])
              db.add_all([
                  User(org_id=org_id, email="qa-admin@example.test", role="admin", password_hash=pw),
                  User(org_id=org_id, email="qa-reviewer@example.test", role="admin", password_hash=pw),
                  User(org_id=org_id, email="qa-viewer@example.test", role="resident", password_hash=pw),
                  User(org_id=other_org.id, email="qa-outside@example.test", role="admin", password_hash=pw),
              ])
          with SessionLocal() as db:
              ensure_sites(db, org_id)
          PY
      - name: Verify shared state and restart persistence
        run: |
          set -Eeuo pipefail
          python3 scripts/qa_stack_smoke.py
          python3 scripts/qa_operational_smoke.py
          # Breve autoprueba del verificador de 24 horas; no equivale a 24 h reales.
          export GALANT_SOAK_EMAIL_A=qa-admin@example.test
          export GALANT_SOAK_EMAIL_B=qa-reviewer@example.test
          export GALANT_SOAK_PASSWORD_A="$QA_SMOKE_PASSWORD"
          export GALANT_SOAK_PASSWORD_B="$QA_SMOKE_PASSWORD"
          python3 scripts/soak_24h.py --url http://127.0.0.1:18612 --period 2026-09 --duration-seconds 4 --interval-seconds 1 --output "$RUNNER_TEMP/qa-soak-check.json"
          python3 - "$RUNNER_TEMP/qa-soak-check.json" <<'PY'
          import json, os, stat, sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          assert report["result"]=="PASS",report
          assert report["successful_samples"]>=2,report
          assert report["completed_at"] is not None
          assert report["elapsed_seconds"]>=4
          assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode)==0o600
          PY
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml restart api worker frontend proxy
          python3 scripts/qa_stack_smoke.py --verify-only
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Chromium without a second system-wide apt upgrade
        run: |
          set -Eeuo pipefail
          python3 -m pip install 'playwright>=1.50,<2'
          # GitHub-hosted Ubuntu runners already provide Chromium shared
          # libraries. --with-deps invokes apt and previously failed during
          # a temporary DNS outage, masking the application QA results.
          # If a required runtime library is missing the browser test MUST
          # fail rather than reporting a false positive.
          python3 -m playwright install chromium
      - name: QA GALANT 15.0.4 - firma elegante en portada y móviles
        run: |
          set -Eeuo pipefail
          export GALANT_CREATOR_QA_OUTPUT="$RUNNER_TEMP/galant-creator-qa"
          python3 scripts/qa_v1504_creator_browser.py
      - name: Verify Red de Obras in browser and after restart
        env:
          GALANT_NETWORK_QA_EMAIL: qa-admin@example.test
        run: |
          set -Eeuo pipefail
          export GALANT_NETWORK_QA_PASSWORD="$QA_SMOKE_PASSWORD"
          python3 scripts/qa_network_browser.py --url http://127.0.0.1:18612 --output "$RUNNER_TEMP/red-de-obras-browser"
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml restart db api worker frontend proxy
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:18612/api/v1/health >/dev/null; then break; fi
            sleep 2
          done
          python3 scripts/qa_network_browser.py --url http://127.0.0.1:18612 --output "$RUNNER_TEMP/red-de-obras-browser" --verify-only
      - name: QA v10.10 — navegación repetida Contratistas/Trabajadores
        env:
          GALANT_QA_EMAIL: qa-admin@example.test
        run: |
          export GALANT_QA_PASSWORD="$QA_SMOKE_PASSWORD"
          python3 scripts/qa_v1010_browser.py
      - name: QA UX 2026 — responsive, obra y capturas reales
        env:
          GALANT_QA_EMAIL: qa-admin@example.test
        run: |
          set -Eeuo pipefail
          export GALANT_QA_PASSWORD="$QA_SMOKE_PASSWORD"
          export GALANT_UX_OUTPUT="$RUNNER_TEMP/ux-2026-browser"
          python3 scripts/qa_ux_2026_browser.py
      - name: QA GALANT 15.0.1 - cambio de pestaña, scroll y carga con Chromium
        env:
          GALANT_QA_EMAIL: qa-admin@example.test
        run: |
          set -Eeuo pipefail
          export GALANT_QA_PASSWORD="$QA_SMOKE_PASSWORD"
          export GALANT_FOCUS_QA_OUTPUT="$RUNNER_TEMP/galant-focus-qa"
          python3 scripts/qa_v1501_focus_browser.py
      - name: QA GALANT 15.0.2 - tabla estable al abrir y actualizar
        env:
          GALANT_QA_EMAIL: qa-admin@example.test
        run: |
          set -Eeuo pipefail
          export GALANT_QA_PASSWORD="$QA_SMOKE_PASSWORD"
          export GALANT_SCROLL_QA_OUTPUT="$RUNNER_TEMP/galant-scroll-qa"
          python3 scripts/qa_v1502_scroll_browser.py
      - name: QA JAVIERA v16.5 - ficha, PDF, reemisión y aislamiento (Chromium)
        env:
          GALANT_JAVIERA_QA_EMAIL: qa-admin@example.test
          GALANT_JAVIERA_QA_REVIEWER_EMAIL: qa-reviewer@example.test
        run: |
          set -Eeuo pipefail
          export GALANT_JAVIERA_QA_PASSWORD="$QA_SMOKE_PASSWORD"
          python3 scripts/qa_javiera_v16_browser.py --url http://127.0.0.1:18612 --output "$RUNNER_TEMP/javiera-v16-browser"
      - name: Bot UX JAVIERA - navegación, accesibilidad, IRL y móviles
        env:
          GALANT_JAVIERA_QA_EMAIL: qa-admin@example.test
        run: |
          set -Eeuo pipefail
          export GALANT_JAVIERA_QA_PASSWORD="$QA_SMOKE_PASSWORD"
          python3 scripts/qa_javiera_ux_bot.py --url http://127.0.0.1:18612 --output "$RUNNER_TEMP/javiera-ux-bot"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galant-javiera-ux-bot
          path: ${{ runner.temp }}/javiera-ux-bot
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galant-javiera-v16-browser
          path: ${{ runner.temp }}/javiera-v16-browser
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galant-v1504-creator-login
          path: ${{ runner.temp }}/galant-creator-qa
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galant-v1502-scroll-browser
          path: ${{ runner.temp }}/galant-scroll-qa
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galant-v1501-focus-browser
          path: ${{ runner.temp }}/galant-focus-qa
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: red-de-obras-browser
          path: ${{ runner.temp }}/red-de-obras-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galant-ux-2026-browser
          path: ${{ runner.temp }}/ux-2026-browser
          if-no-files-found: warn
      - name: Collect QA diagnostics on failure
        if: failure()
        run: |
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml ps || true
          docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml logs --tail=80 api worker proxy || true
      - name: Stop synthetic QA without touching preview
        if: always()
        run: |
          if [ -f .env.qa ]; then
            docker compose -p galant-post-qa --env-file .env.qa -f docker-compose.preview.yml -f docker-compose.qa.yml down --volumes --remove-orphans || true
          fi
          sudo rm -rf -- qa-storage
          rm -f .env.qa
