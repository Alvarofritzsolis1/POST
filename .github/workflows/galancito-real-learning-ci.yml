name: GALANT - aprendizaje real focalizado
on:
  pull_request:
    paths:
      - 'apps/backend/app/ai_*'
      - 'apps/backend/app/galancito_*'
      - 'apps/backend/app/facebook_ai.py'
      - 'apps/backend/app/facebook_chat_worker.py'
      - 'apps/backend/tests/test_ai_real_learning.py'
      - '.github/workflows/galancito-real-learning-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias reales
        run: python -m pip install -r requirements-dev.txt
      - name: Pruebas de aprendizaje y permisos
        run: python -m pytest -q tests/test_ai_real_learning.py
