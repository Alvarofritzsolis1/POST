name: GALANT v12 - auditoria independiente de codigo y dependencias

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-static:
    name: Auditoria Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff>=0.8,<1'
      - name: Scan Python without suppressing findings
        run: |
          ruff check --select E4,E7,E9,F --output-format json apps/backend/app apps/backend/tests > ruff-findings.json || true
          python - <<'PY'
          import json
          data=json.load(open("ruff-findings.json",encoding="utf-8"))
          print(f"Ruff: {len(data)} hallazgos (informe informativo; requiere revisión humana)")
          for item in data[:30]:
              print(item["filename"],item["location"]["row"],item["code"],item["message"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: galant-v12-python-static
          path: ruff-findings.json
  dependencies:
    name: Auditoria dependencias (npm + pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm audit (informativo, no oculta resultados)
        working-directory: apps/frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --json > npm-audit-v12.json || true
          node -e 'const f=require("./npm-audit-v12.json");console.log("npm audit:",JSON.stringify(f.metadata?.vulnerabilities||{}));'
      - name: pip-audit (informativo)
        working-directory: apps/backend
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          pip-audit -r requirements.txt -f json > pip-audit-v12.json || true
          test -s pip-audit-v12.json || printf '{"warning":"Informe no disponible: comprobar acceso a indice de paquetes"}\n' > pip-audit-v12.json
          python - <<'PY'
          import json
          report=json.load(open("pip-audit-v12.json",encoding="utf-8"))
          packages=report.get("dependencies",[]) if isinstance(report,dict) else report
          vulnerable=[p for p in packages if p.get("vulns")]
          print("Paquetes con avisos de seguridad:", len(vulnerable))
          for item in vulnerable:
              print("DEPENDENCIA AFECTADA:",item.get("name"),item.get("version"),"avisos",len(item.get("vulns",[])))
              print("REFERENCIAS:",",".join(v.get("id","") for v in item.get("vulns",[])[:5]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: galant-v12-dependency-audit
          path: |
            apps/frontend/npm-audit-v12.json
            apps/backend/pip-audit-v12.json
