name: Red de Obras - candidatos y permisos
on:
  pull_request:
    paths:
      - "apps/backend/app/network_candidates.py"
      - "apps/backend/app/network_models.py"
      - "apps/backend/app/network_history.py"
      - "apps/backend/app/migrations/v20_9_9_network_candidates.py"
      - "apps/backend/tests/test_network_candidates.py"
      - ".github/workflows/red-de-obras-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: galant_test
          POSTGRES_USER: galant
          POSTGRES_PASSWORD: galant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galant -d galant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://galant:galant_test@127.0.0.1:5432/galant_test
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt
      - name: Instalar dependencias del backend
        run: python -m pip install -r requirements-dev.txt
      - name: Compilar nuevos módulos
        run: python -m compileall -q app/network_candidates.py app/network_models.py app/network_history.py
      - name: Probar candidatos y migraciones legadas en SQLite y PostgreSQL
        run: |
          python -m pytest -q \
            tests/test_network_candidates.py \
            tests/test_labor_release.py::test_additive_migration_idempotent_and_persistent_after_reopen \
            tests/test_network.py::test_migration_from_existing_schema_is_additive_and_reopen_preserves_data
