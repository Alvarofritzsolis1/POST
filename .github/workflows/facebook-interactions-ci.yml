name: GALANT Facebook Interacciones - QA focalizada
on:
  pull_request:
    paths:
      - '.github/workflows/facebook-interactions-ci.yml'
      - 'apps/backend/app/facebook_comment_intelligence.py'
      - 'apps/backend/app/facebook_publication_api.py'
      - 'apps/backend/app/facebook_publication_worker.py'
      - 'apps/backend/app/facebook_publication_models.py'
      - 'apps/backend/app/network_facebook.py'
      - 'apps/backend/app/migrations/v20_9_8_facebook_interactions.py'
      - 'apps/backend/tests/test_facebook_interactions.py'
      - 'apps/frontend/src/FacebookInteractions.tsx'
      - 'apps/frontend/src/FacebookCenter.tsx'
      - 'apps/frontend/src/facebook-interactions.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-backend:
    name: API de comentarios y permisos (Meta sintético)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: galant_test
          POSTGRES_USER: galant
          POSTGRES_PASSWORD: galant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galant -d galant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://galant:galant_test@127.0.0.1:5432/galant_test
      PYTHONPATH: apps/backend:apps/backend/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt
      - name: Instalar dependencias existentes
        run: python -m pip install -r apps/backend/requirements-dev.txt
      - name: Validar sintaxis de la integración
        run: python -m compileall -q apps/backend/app
      - name: Ejecutar pruebas focalizadas
        run: python -m pytest -q apps/backend/tests/test_facebook_publications.py apps/backend/tests/test_facebook_interactions.py

  targeted-frontend:
    name: Compilación de interfaz premium
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults: {run: {working-directory: apps/frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
