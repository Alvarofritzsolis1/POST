name: GALANT - Verificar configuración del VPS

# ÚNICO disparador del despliegue: acción manual sobre main.
# No habilitar push, pull_request ni schedule en este archivo.
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, import_reference]
        default: inspect
      reply_certificate:
        type: string
        required: false
      reference_sha256:
        type: string
        default: 4f063b135d5e9c0d7f9806b57d1cd340bd2ecac78fed77345ffa7ccabbead292

permissions:
  contents: read

# Nunca permitir dos actualizaciones simultáneas en el mismo VPS.
concurrency:
  group: galant-post-vps-preview
  cancel-in-progress: false

jobs:
  desplegar:
    name: Verificar configuración privada del VPS
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/galant-20-vps-verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Configure aquí los revisores obligatorios si el plan de GitHub lo permite.
    environment:
      name: GALANT-VPS

    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '89.117.144.140' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_SHA: a393a073e27849bf65e42a505f0e775bd9b77d60
      REPLY_CERTIFICATE: ${{ inputs.reply_certificate }}
      OPERATION: ${{ inputs.operation }}
      REFERENCE_SHA256: ${{ inputs.reference_sha256 }}

    steps:
      - name: Comprobar autorización y configuración SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/codex/galant-20-vps-verify" ]]; then
            echo "::error::Esta comprobación requiere la rama de operaciones autorizada."
            exit 1
          fi
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Referencia de versión no válida."
            exit 1
          fi
          missing=0
          for key in VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!key}" ]]; then
              echo "::error title=Falta credencial de despliegue::Configura el secreto $key en GitHub Actions."
              missing=1
            fi
          done
          [[ -n "$VPS_HOST" && -n "$VPS_USER" ]] || {
            echo "::error::Debes configurar host y usuario del VPS."
            exit 1
          }
          exit "$missing"

      - name: Preparar clave SSH y host conocido
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/galant_vps_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/galant_known_hosts"
          chmod 600 "$RUNNER_TEMP/galant_vps_key" "$RUNNER_TEMP/galant_known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/galant_vps_key" > /dev/null

      - name: Verificar inventario sin mostrar datos personales
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$REFERENCE_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 64
          [[ "$OPERATION" == "inspect" ]] || { echo "Operación de modificación aún no habilitada" >&2; exit 64; }
          report_file="$RUNNER_TEMP/galant-private-report.json"
          umask 077
          ssh -i "$RUNNER_TEMP/galant_vps_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/galant_known_hosts" -o ConnectTimeout=15 -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "cd /opt/galant-post && docker compose --env-file .env.preview -f docker-compose.preview.yml exec -T api python - '$REFERENCE_SHA256' '$DEPLOY_SHA'" > "$report_file" <<'PYTHON'
          import json, sys
          from sqlalchemy import select, func
          from app.db import SessionLocal
          from app.models import Organization, User
          from app.javiera_models import JavieraExcelLayout, JavieraDossier
          from app.javiera_v166_models import JavieraLocalDossier
          from app.javiera_workbook_models import JavieraWorkbookHead
          from app.version import VERSION, SOURCE_COMMIT
          assert VERSION == '20.0.0-rc1' and SOURCE_COMMIT == sys.argv[2], 'Versión distinta a la solicitada'
          with SessionLocal() as db:
              reference = db.scalars(select(JavieraExcelLayout).where(JavieraExcelLayout.workbook_sha256 == sys.argv[1])).all()
              orgs = db.scalars(select(Organization)).all()
              print(json.dumps({
                  'version': VERSION, 'commit': SOURCE_COMMIT,
                  'organizations': len(orgs),
                  'scopes': [{'id': org.id, 'name': org.name,
                    'admins': [{'id': u.id} for u in db.scalars(select(User).where(User.org_id == org.id, User.role == 'admin', User.enabled.is_(True))).all()],
                    'historical_dossiers': db.scalar(select(func.count()).select_from(JavieraDossier).where(JavieraDossier.org_id == org.id)),
                    'documentary_dossiers': db.scalar(select(func.count()).select_from(JavieraLocalDossier).where(JavieraLocalDossier.org_id == org.id)),
                    'sources': [{'author_id': r.author_id, 'created_at': r.created_at.isoformat()} for r in db.scalars(select(JavieraExcelLayout).where(JavieraExcelLayout.org_id == org.id).order_by(JavieraExcelLayout.created_at.desc()).limit(1)).all()]
                    } for org in orgs],
                  'native_workspaces': db.scalar(select(func.count()).select_from(JavieraWorkbookHead)),
                  'matching_reference_files': len({r.workbook_path for r in reference}),
                  'matching_reference_organizations': len({r.org_id for r in reference}),
                  'enabled_administrators': db.scalar(select(func.count()).select_from(User).where(User.role == 'admin', User.enabled.is_(True))),
                  'historical_dossiers': db.scalar(select(func.count()).select_from(JavieraDossier)),
                  'documentary_dossiers': db.scalar(select(func.count()).select_from(JavieraLocalDossier)),
              }))
          PYTHON
          if [[ -z "$REPLY_CERTIFICATE" ]]; then
            rm -f "$report_file"
            echo "Falta certificado de respuesta privada" >&2
            exit 64
          fi
          printf '%s' "$REPLY_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/reply-cert.pem"
          openssl cms -encrypt -aes-256-gcm -binary -in "$report_file" \
            -out "$RUNNER_TEMP/report.sealed" -outform DER \
            -recip "$RUNNER_TEMP/reply-cert.pem" -keyopt rsa_padding_mode:oaep
          printf 'PRIVATE_REPORT_BASE64='
          base64 -w0 "$RUNNER_TEMP/report.sealed"
          printf '\n'
          rm -f "$report_file" "$RUNNER_TEMP/reply-cert.pem" "$RUNNER_TEMP/report.sealed"

      - name: Limpiar archivos de credenciales temporales
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/galant_vps_key" "$RUNNER_TEMP/galant_known_hosts"
