name: GALANT - Diagnostico MAX POWER VPS (solo lectura)
on:
  push:
    branches: [main]
    paths: [.github/workflows/max-power-vps-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    if: ${{ github.repository == 'Alvarofritzsolis1/POST' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: GALANT-VPS
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '89.117.144.140' }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Validar SSH y host
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/galant_readonly_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/galant_readonly_hosts"
          chmod 600 "$RUNNER_TEMP/galant_readonly_key" "$RUNNER_TEMP/galant_readonly_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/galant_readonly_key" >/dev/null
      - name: Consultar los estados del VPS sin modificar informacion
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$RUNNER_TEMP/galant_readonly_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/galant_readonly_hosts" \
            -o ConnectTimeout=15 -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/galant-post
          dc() { docker compose --env-file .env.preview -f docker-compose.preview.yml "$@" </dev/null; }
          echo "== VERSION ACTIVA (API CONTAINER) =="
          dc exec -T api python -c 'from app.version import VERSION, SOURCE_COMMIT; print("VERSION:",VERSION); print("COMMIT:",SOURCE_COMMIT)'
          echo "== SERVICIOS (DOCKER) =="
          dc ps max-power-controller cpu-lora-manager cpu-2b-manager galancito-training-ollama
          echo "== ESTADOS MAX POWER (SIN ID ORG NI CONVERSACIONES) =="
          dc exec -T db psql -U galant -d galant -A -t -c "SELECT enabled, last_status, experiments, examined_cases, worker_seen_at, next_at FROM ai_max_power_states ORDER BY updated_at DESC LIMIT 2;"
          echo "== SUPERVISOR LORA (SIN DATOS PRIVADOS) =="
          dc exec -T db psql -U galant -d galant -A -t -c "SELECT evidence->>'state', created_at FROM ai_max_power_events WHERE event='cpu_supervisor_status' ORDER BY created_at DESC LIMIT 2;"
          echo "== ULTIMOS PASOS REALES DE PESOS (SIN PROMPTS) =="
          dc exec -T db psql -U galant -d galant -A -t -c "SELECT event, evidence->>'kind', evidence->>'data_kind', evidence->>'step', evidence->>'weights_trained' FROM ai_max_power_events WHERE event LIKE 'ft_%' ORDER BY created_at DESC LIMIT 5;"
          echo "== MODELOS LABORATORIO =="
          dc exec -T galancito-training-ollama ollama list
          echo "== CONFIGURACION LOCAL SOLO MODELO Y BOOLEANO =="
          dc exec -T max-power-controller python -c 'from app.config import settings; c=settings(); print("LOCAL_ENABLED:",c.galancito_local_ai_enabled,"MODEL:",c.galancito_local_model)'
          echo "== PERMISOS REALES DEL ALMACENAMIENTO PRIVADO (SIN MOSTRAR RUTAS DE ORGANIZACIONES) =="
          dc exec -T cpu-lora-manager python -c 'import os,stat; p="/private"; s=os.stat(p); print("TRAINER_UID:",os.geteuid(),"STORAGE_UID:",s.st_uid,"STORAGE_GID:",s.st_gid,"MODE:",oct(stat.S_IMODE(s.st_mode)),"WRITABLE:",os.access(p,os.W_OK|os.X_OK))'
          echo "== PERMISOS DE CACHE QWEN 2B (SIN LEER DATOS) =="
          dc exec -T cpu-lora-manager python -c 'import os; p="/private/cache"; print("CACHE_EXISTS:",os.path.isdir(p),"CACHE_WRITABLE:",os.access(p,os.W_OK|os.X_OK) if os.path.exists(p) else os.access("/private",os.W_OK|os.X_OK))'
          echo "== PROCESOS LORA (SIN ARGUMENTOS NI DATOS PRIVADOS) =="
          cid="$(dc ps -q cpu-lora-manager)"
          docker top "$cid" -eo pid,ppid,stat,etime,pcpu,rss,comm </dev/null || true
          echo "== EVENTOS DE MEMORIA DEL CONTENEDOR =="
          dc exec -T cpu-lora-manager cat /sys/fs/cgroup/memory.events
          echo "== DIARIO LOCAL DE ENTRENAMIENTO: SOLO METRICAS PERMITIDAS =="
          dc exec -T cpu-lora-manager python -c 'import json,time; from pathlib import Path; paths=sorted(Path("/private").glob("*/synthetic-lab*/runs/*/training-metrics.jsonl"),key=lambda p:p.stat().st_mtime,reverse=True)[:4]; print("RUNS:",len(paths)); keys=("kind","step","total_steps","data_kind","weights_trained","cpu_memory_mb","loss","eval_loss","optimizer_steps_new"); [(print("RUN",p.parent.name,"AGE_SECONDS",round(time.time()-p.stat().st_mtime),"LAST",[{k:v for k,v in json.loads(line).items() if k in keys} for line in p.read_text().splitlines()[-4:]],"CHECKPOINTS",len(list((p.parent/"checkpoints").glob("checkpoint-*"))),"FINAL_REPORT",(p.parent/"evaluation.json").is_file())) for p in paths]'
          echo "== ERRORES RECIENTES LORA (SOLO CLASES SIN CONTENIDO) =="
          dc logs --tail=200 cpu-lora-manager 2>&1 | grep -Eo 'OutOfMemoryError|MemoryError|Killed|HTTPError|ReadTimeout|ConnectTimeout|ConnectionError|OSError|ValueError|RuntimeError|TypeError|AttributeError|PermissionError|FileNotFoundError|retry_exhausted|checkpoint no iniciado|Traceback' | sort | uniq -c || true
          echo "== PREFLIGHT CPU REAL =="
          dc exec -T cpu-lora-manager python /src/scripts/train_galancito_cpu_lora.py --preflight || true
          REMOTE
      - name: Destruir archivos temporales de SSH
        if: always()
        run: rm -f "$RUNNER_TEMP/galant_readonly_key" "$RUNNER_TEMP/galant_readonly_hosts"
