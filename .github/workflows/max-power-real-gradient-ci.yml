name: MAX POWER - LoRA CPU con pesos reales (laboratorio aislado)
on:
  pull_request:
    paths:
      - scripts/train_galancito_cpu_lora.py
      - scripts/max_power_cpu_manager.py
      - scripts/max_power_synthetic_lab.py
      - scripts/galancito_lora_progress.py
      - apps/backend/tests/test_max_power_one_button_readiness.py
      - infrastructure/Dockerfile.cpu-lora
      - .github/workflows/max-power-real-gradient-ci.yml
permissions:
  contents: read
jobs:
  gradiente_cpu:
    name: Actualizar pesos sintéticos realmente con Qwen 0.8B en 5 GiB
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compilar contenedor de entrenamiento SIN secretos, bases de datos ni Messenger
        run: |
          set -Eeuo pipefail
          docker build -f infrastructure/Dockerfile.cpu-lora -t galant-cpu-lora-smoke:ci .
      - name: Crear volumen aislado para datos sintéticos verificables
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/maxpower-private"
          sudo chown 10001:10001 "$RUNNER_TEMP/maxpower-private"
          chmod 0700 "$RUNNER_TEMP/maxpower-private"
          docker run --rm --memory 5g --memory-swap 5g --cpus 2 \
            -v "$RUNNER_TEMP/maxpower-private:/private" \
            --entrypoint python galant-cpu-lora-smoke:ci \
            -c 'import sys;sys.path.insert(0,"/src/scripts");from max_power_synthetic_lab import prepare_lab;from pathlib import Path;r,b=prepare_lab(Path("/private/ci"));print("CASOS:",sum(b["sizes"].values()),"PARTICIONES:",b["sizes"],"TIPO:",b["data_kind"])'
      - name: Medir cgroup y memoria, sin entrenar
        run: |
          set -Eeuo pipefail
          docker run --rm --memory 5g --memory-swap 5g --cpus 2 \
            -v "$RUNNER_TEMP/maxpower-private:/private" \
            galant-cpu-lora-smoke:ci --preflight
      - name: Ejecutar 1 paso REAL de optimización LoRA Qwen 0.8B con datos ficticios
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --memory 5g --memory-swap 5g --cpus 2 \
            --pids-limit 96 \
            --security-opt no-new-privileges --cap-drop ALL \
            -e GALANT_SYNTHETIC_DEV_TRAINING=yes \
            -v "$RUNNER_TEMP/maxpower-private:/private" \
            galant-cpu-lora-smoke:ci \
            --dataset /private/ci/synthetic-lab/synthetic.jsonl \
            --output /private/ci/synthetic-lab/runs/ci-gradient-smoke \
            --execute --synthetic-development --max-steps 1 \
            --checkpoint-steps 1 --max-tokens 96
      - name: Verificar pasos, pesos, checkpoints, holdout y ausencia de promoción
        run: |
          set -Eeuo pipefail
          docker run --rm --memory 5g --memory-swap 5g --cpus 2 \
            -v "$RUNNER_TEMP/maxpower-private:/private" \
            --entrypoint python galant-cpu-lora-smoke:ci -c '
          import json
          from pathlib import Path
          output=Path("/private/ci/synthetic-lab/runs/ci-gradient-smoke")
          report=json.loads((output/"evaluation.json").read_text())
          assert report["data_kind"]=="curated_synthetic", report
          assert report["base_model"]=="Qwen/Qwen3.5-0.8B", report
          assert report["weights_trained"] is True
          assert report["new_optimizer_steps"]>=1, report
          assert report["optimizer_start_sha256"] != report["optimizer_end_sha256"]
          assert report["reasoning_improvement_proven"] is False
          assert report["production_promoted"] is False
          assert (output/"candidate-adapter"/"adapter_model.safetensors").is_file()
          assert list((output/"checkpoints").glob("checkpoint-*/optimizer.pt"))
          journal=[json.loads(line) for line in (output/"training-metrics.jsonl").read_text().splitlines()]
          assert any(x["kind"]=="finished" and x["weights_trained"] is True
                     and x["data_kind"]=="curated_synthetic" for x in journal)
          print("LO-RA CPU: PESOS MODIFICADOS Y ADAPTADOR RECUPERABLE EN LABORATORIO")
          '
      - name: Eliminar el volumen efímero de entrenamiento
        if: always()
        shell: bash
        run: |
          sudo rm -rf -- "$RUNNER_TEMP/maxpower-private"
