name: POST - despliegue automatico privado

on:
  workflow_run:
    workflows: ["GALANT POST - CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-preview-vps
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ vars.POST_AUTODEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: post-preview
    steps:
      - name: Comprobar configuracion SSH
        env:
          DEPLOY_HOST: ${{ secrets.POST_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POST_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.POST_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.POST_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_KEY" "$DEPLOY_KNOWN_HOSTS"; do
            if [[ -z "$value" ]]; then
              echo "Faltan Secrets POST_DEPLOY_* en el environment post-preview"
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Actualizar solo POST, nunca GALANT antiguo
        env:
          DEPLOY_HOST: ${{ secrets.POST_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.POST_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/galant-post
          actual_remote="$(git remote get-url origin)"
          case "$actual_remote" in
            "https://github.com/Alvarofritzsolis1/POST.git"|"git@github.com:Alvarofritzsolis1/POST.git") ;;
            *) echo "El directorio NO apunta a POST; abortado"; exit 1;;
          esac
          test -f .env.preview || { echo "Falta .env.preview; ejecutar instalador de POST primero"; exit 1; }
          git fetch origin main
          if git show-ref --verify --quiet refs/heads/main; then
            git checkout main
          else
            git checkout -b main origin/main
          fi
          git pull --ff-only origin main
          docker compose --env-file .env.preview -f docker-compose.preview.yml config --quiet
          COMPOSE_PARALLEL_LIMIT=1 docker compose --env-file .env.preview -f docker-compose.preview.yml build
          docker compose --env-file .env.preview -f docker-compose.preview.yml up -d
          docker compose --env-file .env.preview -f docker-compose.preview.yml exec -T api python -m app.cli init-db
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused \
            http://127.0.0.1:18512/api/v1/health | grep -q '"status":"ok"'
          git log -1 --pretty='POST desplegado: %h %s'
          REMOTE
