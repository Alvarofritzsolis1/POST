# Entorno de prueba POST, aislado del antiguo GALANT.
name: galant-post-preview
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: galant
      POSTGRES_USER: galant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing password}
    volumes:
      - post_db:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galant -d galant"]
      interval: 10s
      timeout: 5s
      retries: 8
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    build: {context: ., dockerfile: apps/backend/Dockerfile, args: {SOURCE_COMMIT: "${SOURCE_COMMIT:-unknown}"}}
    restart: unless-stopped
    environment: &backend
      APP_SECRET: ${APP_SECRET:?Missing APP_SECRET}
      DATABASE_URL: postgresql+psycopg://galant:${POSTGRES_PASSWORD}@db:5432/galant
      DOCUMENT_DIR: /data/private
      OCR_LANGUAGE: ${OCR_LANGUAGE:-spa+eng}
      OCR_SECONDARY: disabled
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-50}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FACEBOOK_MANUAL_TESTING_ENABLED: ${FACEBOOK_MANUAL_TESTING_ENABLED:-false}
      FACEBOOK_AUTOPUBLISH_ENABLED: ${FACEBOOK_AUTOPUBLISH_ENABLED:-false}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_MESSAGING_ENABLED: ${FACEBOOK_MESSAGING_ENABLED:-false}
      FACEBOOK_ORG_ID: ${FACEBOOK_ORG_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_WEBHOOK_VERIFY_TOKEN: ${FACEBOOK_WEBHOOK_VERIFY_TOKEN:-}
      FACEBOOK_AI_ENABLED: ${FACEBOOK_AI_ENABLED:-false}
      FACEBOOK_AI_AUTO_REPLY_ENABLED: ${FACEBOOK_AI_AUTO_REPLY_ENABLED:-false}
      FACEBOOK_AI_AD_ENABLED: ${FACEBOOK_AI_AD_ENABLED:-false}
      FACEBOOK_WORKER_POLL_SECONDS: ${FACEBOOK_WORKER_POLL_SECONDS:-1}
      FACEBOOK_AI_MODEL: ${FACEBOOK_AI_MODEL:-gpt-4.1-mini}
      FACEBOOK_AI_PROVIDER: ${FACEBOOK_AI_PROVIDER:-openai}
      FACEBOOK_AI_API_KEY: ${FACEBOOK_AI_API_KEY:-}
      GALANCITO_AI_ENABLED: ${GALANCITO_AI_ENABLED:-false}
      GALANCITO_AI_MODEL: ${GALANCITO_AI_MODEL:-gpt-4.1-mini}
      GALANCITO_AI_PROVIDER: ${GALANCITO_AI_PROVIDER:-openai}
      GALANCITO_AI_API_KEY: ${GALANCITO_AI_API_KEY:-}
      GALANCITO_LOCAL_AI_ENABLED: ${GALANCITO_LOCAL_AI_ENABLED:-false}
      GALANCITO_KEEP_ALIVE: ${GALANCITO_KEEP_ALIVE:-2m}
      GALANCITO_NUM_PREDICT: ${GALANCITO_NUM_PREDICT:-140}
      GALANCITO_NUM_CTX: ${GALANCITO_NUM_CTX:-2048}
      GALANCITO_NUM_THREAD: ${GALANCITO_NUM_THREAD:-1}
      GALANCITO_TIMEOUT_SECONDS: ${GALANCITO_TIMEOUT_SECONDS:-24}
      GALANCITO_MEMORY_RESERVE_MB: ${GALANCITO_MEMORY_RESERVE_MB:-1536}

    volumes: ["./preview-storage:/data/private"]
    depends_on: {db: {condition: service_healthy}}
    networks: [internal, galancito-egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=5)"]
      interval: 15s
      retries: 8
      timeout: 7s
      start_period: 35s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 550m
    logging: *logs
  worker:
    build: {context: ., dockerfile: apps/backend/Dockerfile, args: {SOURCE_COMMIT: "${SOURCE_COMMIT:-unknown}"}}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *backend
    volumes: ["./preview-storage:/data/private"]
    depends_on: {db: {condition: service_healthy}}
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 950m
    cpus: 1.0
    pids_limit: 100
    logging: *logs
  facebook-publisher:
    build: {context: ., dockerfile: apps/backend/Dockerfile, args: {SOURCE_COMMIT: "${SOURCE_COMMIT:-unknown}"}}
    restart: unless-stopped
    command: ["python", "-m", "app.network_facebook"]
    environment:
      <<: *backend
      FACEBOOK_PAGE_TOKEN: ${FACEBOOK_PAGE_TOKEN:-}
    depends_on: {db: {condition: service_healthy}}
    networks: [internal, frontend-network]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 150m
    pids_limit: 50
    logging: *logs
  # Opcional: solo mensajes Facebook y orientación Red de Obras.
  # Se habilita con --profile local-ai y NUNCA expone el puerto 11434 en el VPS.
  galancito-ollama:
    image: ollama/ollama:latest
    profiles: [local-ai]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_KEEP_ALIVE: ${GALANCITO_KEEP_ALIVE:-2m}
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      - galancito_models:/root/.ollama
    networks: [internal, galancito-egress]
    mem_limit: 3g
    mem_reservation: 1500m
    cpus: 1.5
    cpu_shares: 128
    pids_limit: 180
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logs
  frontend:
    build: {context: ., dockerfile: apps/frontend/Dockerfile}
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]
    mem_limit: 120m
    security_opt: [no-new-privileges:true]
    logging: *logs
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${PORT:-18512}:80"]
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [frontend, api]
    networks: [internal, frontend-network]
    mem_limit: 130m
    security_opt: [no-new-privileges:true]
    logging: *logs
networks:
  internal: {internal: true}
  frontend-network: {}
  # Outbound HTTPS for explicit Galancito AI, without exposing an API port.
  galancito-egress: {}
volumes:
  post_db: {}
  galancito_models: {}
